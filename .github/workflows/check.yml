name: Проверка сайтов

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Проверить сайты
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash check.sh
      # раз в сутки сохраняем состояние: GitHub отключает расписание в репозитории без коммитов 60 дней
      - name: Ежедневная запись
        run: |
          if [ "$(git log -1 --format=%cs -- status.md)" != "$(date -u +%F)" ]; then
            git config user.name "sites-monitor"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add status.md
            git commit -m "Состояние на $(date -u '+%Y-%m-%d')" && git push || true
          fi
